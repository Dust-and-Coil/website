name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build preview
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          bundle exec jekyll build \
            --baseurl "/website-previews/pr-${PR_NUMBER}" \
            --config _config.yml,_config.preview.yml
          # Never publish the production CNAME into the preview host.
          rm -f _site/CNAME

      - name: Publish to website-previews
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          external_repository: Dust-and-Coil/website-previews
          publish_branch: main
          publish_dir: ./_site
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          allow_empty_commit: true
          commit_message: "Preview for website PR #${{ github.event.number }}"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://dust-and-coil.github.io/website-previews/pr-${context.payload.pull_request.number}/`;
            const marker = '<!-- dust-and-coil-preview-bot -->';
            const body = `${marker}\n**Preview:** ${url}\n\nUpdates on each push to this PR. Production stays at https://dustandcoil.com.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview folder
        uses: actions/github-script@v7
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        with:
          github-token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
          script: |
            const owner = 'Dust-and-Coil';
            const repo = 'website-previews';
            const path = `pr-${process.env.PR_NUMBER}`;
            const ref = 'main';
            async function deletePath(filePath) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref });
              if (Array.isArray(data)) {
                for (const item of data) {
                  await deletePath(item.path);
                }
                return;
              }
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: filePath,
                message: `Remove preview for website PR #${process.env.PR_NUMBER}`,
                sha: data.sha,
                branch: ref,
              });
            }
            try {
              await deletePath(path);
              core.info(`Removed ${path}`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`${path} already gone`);
                return;
              }
              throw e;
            }

# Site settings
title: Dust & Coil
email: hello@dustandcoil.com
description: >-
  Dust & Coil Audio Laboratories — effects for bass players, built in Colorado.
  Plugins for the Darkglass Anagram, with a focus on making an upright bass
  sound like an upright bass.
baseurl: "/website" # this repo publishes to dust-and-coil.github.io/website
url: "https://dust-and-coil.github.io"
github_username: Dust-and-Coil

# Contact form backend. Replace with the form ID from your Formspree account
# (https://formspree.io) — until then the form posts nowhere useful.
formspree_id: "YOUR_FORM_ID"

# Build settings
theme: minima
plugins:
  - jekyll-feed

minima:
  social_links:
    github: Dust-and-Coil

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
